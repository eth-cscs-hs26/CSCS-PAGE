  <path d="M18.6 10 C 18.4 3.6 32.8 3.4 33 10 Z" fill="url(#hat)"/>
  <path d="M18.6 8.6 C 22 10.6 29.6 10.6 33 8.6 L33.1 10.4 C 29.6 12.4 22 12.4 18.5 10.4 Z" fill="#26456E"/>
  <ellipse cx="25.8" cy="10.2" rx="13.4" ry="2.5" fill="#C99A4F" opacity="0.0"/>

  <!-- walking stick and near arm -->
  <path d="M38.6 28.6 L45.4 58.4" stroke="#6E4F28" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  <circle cx="38.5" cy="28.4" r="1.7" fill="#5E4222"/>
  <path d="M28.4 25 L32.4 31.6 L37.6 33.4" stroke="#2D5287" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="38.7" cy="33.6" r="2" fill="#D9A57E"/>
</svg>
