<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 64" width="48" height="64">
  <defs>
    <linearGradient id="hat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E3B96F"/>
      <stop offset="1" stop-color="#BD8D45"/>
    </linearGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="25" cy="60.6" rx="17" ry="2.7" fill="#2B2A28" opacity="0.14"/>
  <ellipse cx="25" cy="60.4" rx="11" ry="1.7" fill="#2B2A28" opacity="0.2"/>

  <!-- far arm, swinging back -->
  <path d="M22 25.5 L16.5 32 L14.8 37.6" stroke="#1D3A62" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="14.6" cy="39.2" r="1.9" fill="#C98E69"/>

  <!-- far leg and boot, trailing -->
  <path d="M22.5 42 L18.8 49.6 L14.6 54" stroke="#25242A" stroke-width="5.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M11.2 51.6 L16.8 50.4 L18.4 54.6 C19.6 56.2 19.7 57.8 18.9 58.9 L14.8 58.9 C12.6 57.4 11 55.4 10.9 53.2 Z" fill="#3E2C24"/>

  <!-- near leg and boot, stepping -->
  <path d="M26 42 L31 49.4 L34.2 54.4" stroke="#2F2E36" stroke-width="5.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M31 52 L37 52 L37.4 55.2 C40 55.5 41.8 57 41.6 58.9 L31.8 58.9 C31.2 56.6 31 54.4 31 52 Z" fill="#4A3326"/>
  <path d="M31.8 58.9 L41.6 58.9 L41.5 57.9 L31.7 57.9 Z" fill="#2B1F1A"/>

  <!-- coat, lit side on the left -->
  <path d="M19.2 23.6 C 18.2 29 17.2 37 12.8 45.8 L34.2 44.6 C 33.2 37 32.4 30 31 24 C 28.4 21.6 22 21.4 19.2 23.6 Z" fill="#26456E"/>
  <path d="M19.2 23.6 C 18.2 29 17.2 37 12.8 45.8 L21 45.2 C 21.4 37 22.4 29 24 22.1 C 22 22.1 20.2 22.6 19.2 23.6 Z" fill="#3F6CA3"/>
  <path d="M13.6 44 L34.2 43 L34.2 44.6 L12.8 45.8 Z" fill="#1B3558"/>

  <!-- satchel strap and bag -->
  <path d="M21.4 23.4 L29 35" stroke="#5E4A2B" stroke-width="1.6" fill="none"/>
  <g transform="rotate(-8 32 39.5)">
    <rect x="26.5" y="34" width="11" height="9.6" rx="1.7" fill="#8A6D3B"/>
    <path d="M26.5 35.7 A1.7 1.7 0 0 1 28.2 34 L35.8 34 A1.7 1.7 0 0 1 37.5 35.7 L37.5 38.6 L26.5 38.6 Z" fill="#A98A52"/>
    <circle cx="32" cy="38.6" r="0.9" fill="#E8C070"/>
  </g>

  <!-- scarf with a tail in the wind -->
  <path d="M20.4 20 C 16.4 18.4 12.6 21.2 8.4 19.8 L7.4 24.6 C 11.8 26.2 15.6 24 20.8 24.6 Z" fill="#E69F00"/>
  <path d="M20.6 22.6 C 16.6 22.2 12.6 24.2 8 23 L7.4 24.6 C 11.8 26.2 15.6 24 20.8 24.6 Z" fill="#C98200" opacity="0.7"/>
  <ellipse cx="25.6" cy="21.9" rx="6.4" ry="2.9" fill="#C98200"/>
  <ellipse cx="25.6" cy="20.6" rx="6.4" ry="2.9" fill="#E69F00"/>

  <!-- head -->
  <circle cx="25.8" cy="15.2" r="4.8" fill="#D9A57E"/>
  <circle cx="30.4" cy="15.9" r="1.1" fill="#D9A57E"/>
  <circle cx="28.5" cy="15" r="0.5" fill="#4A3326"/>
  <path d="M21.4 11.4 C 19.4 14.4 19.6 18.8 21.6 20.6 C 23 20.4 24.2 19.6 24.6 18.8 C 23.2 16.8 22.8 14 23 11.6 Z" fill="#3B2A22"/>

  <!-- hat -->
