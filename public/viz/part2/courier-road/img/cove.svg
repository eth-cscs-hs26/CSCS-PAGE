    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E5793D"/>
      <stop offset="0.55" stop-color="#C9553B"/>
      <stop offset="1" stop-color="#7E3040"/>
