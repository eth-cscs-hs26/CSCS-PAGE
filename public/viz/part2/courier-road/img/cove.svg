      <stop offset="0.72" stop-color="#6F4B90"/>
      <stop offset="0.94" stop-color="#C9807F"/>
      <stop offset="1" stop-color="#E3A08A"/>
    </linearGradient>
    <linearGradient id="sea" gradientUnits="userSpaceOnUse" x1="0" y1="96" x2="0" y2="128">
