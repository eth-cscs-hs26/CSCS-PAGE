<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180">
  <defs>
    <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="102">
      <stop offset="0" stop-color="#2E3A74"/>
      <stop offset="0.36" stop-color="#6A4B95"/>
      <stop offset="0.64" stop-color="#B25F90"/>
      <stop offset="0.84" stop-color="#F08A5D"/>
      <stop offset="1" stop-color="#FFD27A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE9B0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFB070" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFC857" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFC857" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3B58E"/>
      <stop offset="0.42" stop-color="#6FCBC6"/>
      <stop offset="1" stop-color="#339AAC"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8DCCB"/>
      <stop offset="1" stop-color="#B58BAE"/>
    </linearGradient>
    <linearGradient id="mound" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#F0C4B8"/>
      <stop offset="0.55" stop-color="#CC9EB6"/>
      <stop offset="1" stop-color="#8A68A4"/>
    </linearGradient>
  </defs>

  <!-- dusk sky -->
  <rect width="240" height="180" fill="url(#sky)"/>
