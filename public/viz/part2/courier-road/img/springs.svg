  <ellipse cx="164" cy="90" rx="38" ry="3.4" fill="#6F4F8E" opacity="0.5"/>
  <rect x="132" y="88" width="64" height="3.6" fill="#6A4332"/>
  <rect x="138" y="64" width="52" height="24" fill="#D8965E"/>
  <rect x="164" y="64" width="26" height="24" fill="#B97A50" opacity="0.7"/>
  <path d="M127 66 L164 40 L201 66 Z" fill="#7A3A4E"/>
  <path d="M127 66 L164 40 L164 66 Z" fill="#B65F40"/>
  <rect x="127" y="64.2" width="74" height="3" fill="#4F2B3A"/>
  <rect x="157" y="72" width="14" height="16" rx="1.2" fill="#FFC857"/>
  <rect x="159" y="74" width="10" height="14" rx="1" fill="#FFE29A"/>
  <rect x="143" y="71" width="9" height="8.5" fill="#FFC857"/>
  <rect x="176" y="71" width="9" height="8.5" fill="#FFC857"/>
  <path d="M147.5 71 V79.5 M143 75.2 H152 M180.5 71 V79.5 M176 75.2 H185" stroke="#9C6A3A" stroke-width="0.7"/>
  <circle cx="147.5" cy="75" r="10" fill="url(#halo)"/>
  <circle cx="180.5" cy="75" r="10" fill="url(#halo)"/>
  <path d="M131 67 V70 M197 67 V70" stroke="#4F2B3A" stroke-width="0.8"/>
  <circle cx="131" cy="75" r="9" fill="url(#halo)"/>
  <circle cx="197" cy="75" r="9" fill="url(#halo)"/>
  <ellipse cx="131" cy="73" rx="2.6" ry="3.4" fill="#FF9A4D"/>
  <ellipse cx="197" cy="73" rx="2.6" ry="3.4" fill="#FF9A4D"/>

  <!-- steam -->
  <g fill="#FFF8F2" opacity="0.7">
    <circle cx="126" cy="94" r="6.5"/>
    <circle cx="121" cy="83" r="8"/>
    <circle cx="115" cy="71" r="9"/>
    <circle cx="94" cy="116" r="5.5"/>
    <circle cx="89" cy="107" r="6.5"/>
    <circle cx="84" cy="96" r="7"/>
