    <circle cx="96" cy="8" r="0.8" opacity="0.6"/>
    <circle cx="184" cy="13" r="0.9" opacity="0.65"/>
    <circle cx="218" cy="30" r="0.7" opacity="0.5"/>
    <circle cx="14" cy="38" r="0.7" opacity="0.5"/>
  </g>
  <ellipse cx="200" cy="52" rx="28" ry="2.4" fill="#F6B9B3" opacity="0.5"/>
  <ellipse cx="38" cy="56" rx="22" ry="2.2" fill="#F6B9B3" opacity="0.5"/>
  <circle cx="64" cy="84" r="58" fill="url(#glow)"/>
  <circle cx="64" cy="82" r="14" fill="#FFEBB8"/>

  <!-- far and near mountain ranges -->
  <path d="M0 100 L18 84 L34 92 L52 76 L66 89 L84 80 L104 96 L124 70 L146 92 L166 66 L190 88 L212 70 L240 90 L240 130 L0 130 Z" fill="#A06BA2"/>
  <path d="M124 70 L104 96 L116 98 L124 86 L128 92 Z" fill="#D590A6" opacity="0.5"/>
  <path d="M166 66 L146 92 L158 94 L166 80 L170 86 Z" fill="#D590A6" opacity="0.5"/>
  <path d="M0 114 L22 94 L44 106 L72 86 L96 108 L120 96 L146 114 L172 88 L198 108 L222 92 L240 104 L240 140 L0 140 Z" fill="#5A4A92"/>
  <path d="M72 86 L44 106 L58 110 L69 98 L74 106 Z" fill="#B96A98" opacity="0.55"/>
  <path d="M172 88 L146 114 L160 116 L170 100 L176 110 Z" fill="#B96A98" opacity="0.45"/>
  <path d="M222 92 L198 108 L212 112 L220 102 L226 108 Z" fill="#B96A98" opacity="0.45"/>
  <path d="M22 94 L0 114 L14 116 L22 104 L28 110 Z" fill="#B96A98" opacity="0.45"/>

  <!-- the pale rock mound -->
  <path d="M-10 180 L-10 126 C 14 118 32 110 54 103 C 82 95 110 89 136 87 C 152 86 176 87 198 89 C 216 91 232 96 250 102 L250 180 Z" fill="url(#mound)"/>

  <!-- boardwalk down from the bathhouse -->
  <path d="M184 90 L206 90 L252 166 L252 184 L216 184 Z" fill="#B97B4E"/>
  <path d="M184 90 L196 90 L234 184 L216 184 Z" fill="#D3925A" opacity="0.55"/>
  <g stroke="#8A5A3C" stroke-width="0.9" opacity="0.7">
    <path d="M188 98 L210 98"/><path d="M193 108 L216 108"/><path d="M199 119 L224 119"/>
    <path d="M205 131 L233 131"/><path d="M212 144 L243 144"/><path d="M220 158 L252 158"/>
  </g>

