    <circle cx="104" cy="45" r="8"/>
    <circle cx="100" cy="33" r="6"/>
    <circle cx="79" cy="86" r="6"/>
    <circle cx="75" cy="76" r="5"/>
  </g>

  <!-- pool A, top -->
  <path d="M110 102 A36 9 0 0 0 182 102 L182 111 A36 9 0 0 1 110 111 Z" fill="url(#wall)"/>
  <ellipse cx="146" cy="102" rx="36" ry="9" fill="#FDEBDD"/>
  <ellipse cx="146" cy="102.8" rx="31" ry="6.4" fill="url(#water)"/>
  <!-- pool B -->
  <path d="M76 124 A48 12 0 0 0 172 124 L172 135 A48 12 0 0 1 76 135 Z" fill="url(#wall)"/>
  <ellipse cx="124" cy="124" rx="48" ry="12" fill="#FDEBDD"/>
  <ellipse cx="124" cy="124.9" rx="42.5" ry="8.8" fill="url(#water)"/>
  <!-- pool C, front -->
  <path d="M44 151 A62 15.5 0 0 0 168 151 L168 164 A62 15.5 0 0 1 44 164 Z" fill="url(#wall)"/>
  <ellipse cx="106" cy="151" rx="62" ry="15.5" fill="#FDEBDD"/>
  <ellipse cx="106" cy="152" rx="56" ry="11.5" fill="url(#water)"/>

  <!-- pines at the edges -->
  <g fill="#28405C">
    <rect x="19" y="136" width="3" height="8"/>
    <path d="M20.5 98 L10 124 L31 124 Z"/>
    <path d="M20.5 110 L6 138 L35 138 Z"/>
    <rect x="226" y="120" width="3" height="8"/>
    <path d="M227.5 92 L217 116 L238 116 Z"/>
    <path d="M227.5 104 L214 130 L241 130 Z"/>
  </g>

  <!-- reed tufts by the pools -->
  <g stroke="#3F5D5A" stroke-width="1.3" stroke-linecap="round" fill="none">
    <path d="M178 130 q-1 -6 -4 -8 M178 130 q0 -7 1 -9 M178 130 q2 -5 5 -7"/>
    <path d="M176 156 q-1 -6 -4 -8 M176 156 q0 -7 1 -9 M176 156 q2 -5 5 -7"/>
