  <!-- lantern posts and a bird -->
  <circle cx="198" cy="118" r="10" fill="url(#halo)"/>
  <rect x="197.2" y="120" width="1.6" height="12" fill="#4A2F3A"/>
  <ellipse cx="198" cy="118.5" rx="2.6" ry="3.4" fill="#FFB35A"/>
  <circle cx="222" cy="152" r="10" fill="url(#halo)"/>
  <rect x="221.2" y="154" width="1.6" height="12" fill="#4A2F3A"/>
  <ellipse cx="222" cy="152.5" rx="2.6" ry="3.4" fill="#FFB35A"/>
  <path d="M200 30 q4 -5 8 0 q4 -5 8 0 q-4 1 -8 4 q-4 -3 -8 -4 z" fill="#2B2A28" opacity="0.7"/>
